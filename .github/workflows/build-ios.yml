name: Build iOS IPA

# Builds an unsigned iPhone/iPad .ipa on GitHub's macOS runners, so no Mac is needed.
# Download the artifact, then sign it with your own Apple ID on Windows (cider or Sideloadly).
#
# First run: 2–4 hours. Later runs reuse the caches below and are much faster.
# Repo must be public for macOS runner minutes to be free.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          python3 --version
          sw_vers

      # Build-time tweaks that cannot be pushed from a phone: the app calls itself
      # Yingxia / 映匣 in its strings, and the file importer dims unknown file types.
      - name: Apply build overrides
        run: python3 Scripts/build-overrides.py

      - name: Install build tools
        run: brew install xcodegen autoconf automake libtool python@3.14

      # The icon art is kept as a JPEG so it can be committed from a phone-sized
      # connection; the asset catalogue needs a 1024×1024 PNG.
      - name: App icon
        run: |
          if [ -f Config/icon/appicon.jpg ]; then
            sips -s format png Config/icon/appicon.jpg --out Config/iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png
            sips -g pixelWidth -g pixelHeight Config/iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          fi

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
            ~/Library/Caches/tvbox-nodejs-mobile
            build/AppleRuntime
          key: ios-native-v1

      - name: Build FFmpeg
        run: Scripts/build-apple-ffmpeg.sh

      - name: Build libass
        run: Scripts/build-apple-libass.sh

      # The iOS app's Java bindings compile against the Mac host's jar and its libraries
      # (keystone, capstone, BouncyCastle), so it has to exist even for an iOS-only build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Build Java host
        run: Scripts/build-java-host.sh

      # Builds the embedded JVM (openjdk/mobile, zero interpreter) plus libffi, Unicorn,
      # Capstone, Keystone and the JNI bindings, and packages build/AppleRuntime/iphoneos.
      # About 35 minutes; skiped when the packaged runtime comes back from the cache.
      - name: Build embedded JVM runtime
        run: |
          if [ -f build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a ]; then
            echo "Using the packaged runtime from the cache"
          else
            Scripts/package-apple-runtime.sh ios
          fi

      - name: Save native caches
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/tvbox-ffmpeg
            ~/Library/Caches/tvbox-libass
            ~/Library/Caches/tvbox-nodejs-mobile
            build/AppleRuntime
          key: ios-native-v1

      - name: JVM configure log
        if: failure()
        run: |
          f=build/apple-runtime/openjdk-mobile/config.log
          [ -f "$f" ] && tail -n 120 "$f" || true

      # Scripts are the only source kind this build cannot run yet: TVBox Python sources need the
      # CPython that Scripts/build-apple-python.sh assembles (Python sources stay hidden and
      # unbrowsable without it, see EmbeddedPythonHost.available). pycryptodome and lxml compile
      # for the device, so this takes a while and the result is cached under its own key.
      - name: Cache iOS Python runtime
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/apple-python
            build/ApplePython
          key: ios-python-v1

      - name: Build iOS Python runtime
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: |
          HOST_PYTHON="$(command -v python3.14 || true)"
          if [ -z "$HOST_PYTHON" ]; then
            HOST_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          fi
          export HOST_PYTHON
          "$HOST_PYTHON" --version
          Scripts/build-apple-python.sh ios
          ls -d build/ApplePython/iphoneos/PythonHost build/ApplePython/iphoneos/Frameworks/Python.framework

      - name: Save iOS Python runtime
        if: success() && steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/apple-python
            build/ApplePython
          key: ios-python-v1

      # Only the iOS target is built; the macOS-only host folders just have to exist.
      - name: Stub macOS resources
        run: mkdir -p build/ScriptHost build/PythonHost build/JavaHost

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TVBox.xcodeproj \
            -scheme TVBox-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENT="" \
            build | tee build/xcodebuild.log

      - name: Package IPA 
        run: |
          APT="build/DerivedData-ios/Build/Products/Release-iphoneos/TVBox-iOS.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Yingxia-ios-unsigned.ipa"
          cd ..
          ls -lh Yingxia-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Yingxia-ios-unsigned.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
